<!DOCTYPE html>
<html>
<head>
<title>Mine Game</title>
</head>
<body>

<h3>MINESWEEPER</h3>

<div id="info">Mines: 10</div>
<div id="game"></div>

<script type="text/javascript">

var W = 9;
var H = 9;
var M = 10;
var board = [];
var first = 1;
var over = 0;

function start() {
    var x, y;

    board = [];

    for (y = 0; y < H; y++) {
        board[y] = [];

        for (x = 0; x < W; x++) {
            board[y][x] = {
                mine: 0,
                open: 0,
                number: 0
            };
        }
    }

    draw();
}

function draw() {
    var s = "";
    var x, y, c, text;

    for (y = 0; y < H; y++) {

        for (x = 0; x < W; x++) {

            c = board[y][x];

            if (c.open) {

                if (c.mine) {
                    text = "*";
                } else {
                    text = c.number;
                }

            } else {
                text = "#";
            }

            s += "<input type=\"button\" value=\"" +
                 text +
                 "\" onclick=\"clickCell(" +
                 x +
                 "," +
                 y +
                 ")\">";
        }

        s += "<br>";
    }

    document.getElementById("game").innerHTML = s;
}

function makeMines(sx, sy) {

    var placed = 0;
    var x, y;

    while (placed < M) {

        x = Math.floor(Math.random() * W);
        y = Math.floor(Math.random() * H);

        if (Math.abs(x - sx) <= 1 &&
            Math.abs(y - sy) <= 1) {

            continue;
        }

        if (!board[y][x].mine) {

            board[y][x].mine = 1;
            placed++;
        }
    }

    for (y = 0; y < H; y++) {

        for (x = 0; x < W; x++) {

            board[y][x].number =
                countMines(x, y);
        }
    }
}

function countMines(x, y) {

    var n = 0;
    var xx, yy;

    for (yy = y - 1; yy <= y + 1; yy++) {

        for (xx = x - 1; xx <= x + 1; xx++) {

            if (xx >= 0 &&
                xx < W &&
                yy >= 0 &&
                yy < H) {

                if (board[yy][xx].mine) {
                    n++;
                }
            }
        }
    }

    return n;
}

function clickCell(x, y) {

    var c;

    if (over) {
        return;
    }

    c = board[y][x];

    if (c.open) {
        return;
    }

    if (first) {

        makeMines(x, y);
        first = 0;
    }

    if (c.mine) {

        c.open = 1;
        over = 1;

        showMines();
        draw();

        document.getElementById("info").innerHTML =
            "BOOM - RELOAD TO PLAY AGAIN";

        return;
    }

    openArea(x, y);

    draw();

    if (won()) {

        over = 1;

        document.getElementById("info").innerHTML =
            "YOU WIN!";
    }
}

function openArea(x, y) {

    var list = [];
    var p;
    var xx;
    var yy;
    var c;

    list.push([x, y]);

    while (list.length > 0) {

        p = list.pop();

        xx = p[0];
        yy = p[1];

        c = board[yy][xx];

        if (c.open || c.mine) {
            continue;
        }

        c.open = 1;

        if (c.number == 0) {

            if (xx > 0) {
                list.push([xx - 1, yy]);
            }

            if (xx < W - 1) {
                list.push([xx + 1, yy]);
            }

            if (yy > 0) {
                list.push([xx, yy - 1]);
            }

            if (yy < H - 1) {
                list.push([xx, yy + 1]);
            }
        }
    }
}

function showMines() {

    var x, y;

    for (y = 0; y < H; y++) {

        for (x = 0; x < W; x++) {

            if (board[y][x].mine) {
                board[y][x].open = 1;
            }
        }
    }
}

function won() {

    var x, y;

    for (y = 0; y < H; y++) {

        for (x = 0; x < W; x++) {

            if (!board[y][x].mine &&
                !board[y][x].open) {

                return 0;
            }
        }
    }

    return 1;
}

start();

</script>

</body>
</html>
