<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN">
<html>
<head>
<title>Mini Minesweeper</title>

<style type="text/css">
body {
    font-family: Arial;
}

table {
    border-collapse: collapse;
}

td {
    width:24px;
    height:24px;
    border:1px solid #888;
    background:#ccc;
    text-align:center;
    font-weight:bold;
    cursor:pointer;
}
</style>

<script type="text/javascript">

var W = 8;
var H = 8;
var MINES = 10;

var board = [];
var revealed = [];

function init() {
    var x, y;

    for (y=0;y<H;y++) {
        board[y]=[];
        revealed[y]=[];
        for (x=0;x<W;x++) {
            board[y][x]=0;
            revealed[y][x]=0;
        }
    }

    var m=0;
    while(m<MINES){
        x=Math.floor(Math.random()*W);
        y=Math.floor(Math.random()*H);
        if(board[y][x]!="M"){
            board[y][x]="M";
            m++;
        }
    }

    for(y=0;y<H;y++){
        for(x=0;x<W;x++){

            if(board[y][x]=="M") continue;

            var n=0;
            var dx,dy;

            for(dy=-1;dy<=1;dy++){
                for(dx=-1;dx<=1;dx++){
                    var xx=x+dx;
                    var yy=y+dy;

                    if(xx>=0 && xx<W && yy>=0 && yy<H){
                        if(board[yy][xx]=="M") n++;
                    }
                }
            }

            board[y][x]=n;
        }
    }

    draw();
}

function draw(){

    var html="<table>";

    var x,y;

    for(y=0;y<H;y++){

        html+="<tr>";

        for(x=0;x<W;x++){

            var text="";

            if(revealed[y][x]){

                if(board[y][x]=="M")
                    text="*";
                else if(board[y][x]>0)
                    text=board[y][x];

            }

            html+='<td onclick="clickCell('+x+','+y+')">'+text+'</td>';

        }

        html+="</tr>";
    }

    html+="</table>";

    document.getElementById("game").innerHTML=html;
}

function reveal(x,y){

    if(x<0||y<0||x>=W||y>=H) return;
    if(revealed[y][x]) return;

    revealed[y][x]=1;

    if(board[y][x]!=0) return;

    reveal(x-1,y-1);
    reveal(x,y-1);
    reveal(x+1,y-1);

    reveal(x-1,y);
    reveal(x+1,y);

    reveal(x-1,y+1);
    reveal(x,y+1);
    reveal(x+1,y+1);
}

function clickCell(x,y){

    if(board[y][x]=="M"){

        var xx,yy;

        for(yy=0;yy<H;yy++)
            for(xx=0;xx<W;xx++)
                revealed[yy][xx]=1;

        draw();

        alert("Game Over");
        return;
    }

    reveal(x,y);
    draw();
}

</script>

</head>

<body onload="init()">

<h2>Minesweeper</h2>

<div id="game"></div>

</body>
</html>
